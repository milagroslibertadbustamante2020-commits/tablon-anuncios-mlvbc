{% extends "base.html" %}

{% block titulo %}{{ 'Editar' if anuncio else 'Nuevo' }} anuncio{% endblock %}

{% block contenido %}
<h2 class="mb-3">{{ 'Editar anuncio' if anuncio else 'Nuevo anuncio' }}</h2>
<div class="card shadow-sm"><div class="card-body">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" name="titulo" class="form-control" maxlength="150" required
                   value="{{ request.form.get('titulo', anuncio.titulo if anuncio else '') }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Contenido</label>
            <textarea name="contenido" rows="5" class="form-control" required>{{ request.form.get('contenido', anuncio.contenido if anuncio else '') }}</textarea>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Categoría</label>
                <select name="categoria_id" class="form-select" required>
                    {% for c in categorias %}
                    <option value="{{ c.id }}" {{ 'selected' if anuncio and anuncio.categoria_id == c.id else '' }}>{{ c.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Usuario (autor)</label>
                <select name="usuario_id" class="form-select" required>
                    {% for u in usuarios %}
                    <option value="{{ u.id }}" {{ 'selected' if usuario_actual == u.id else '' }}>{{ u.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('anuncios.lista') }}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div></div>
{% endblock %}
